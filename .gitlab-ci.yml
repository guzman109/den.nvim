# Checks run on every push, on Linux. macOS is covered by running the same
# commands locally before pushing (GitLab's hosted macOS runners are a paid
# plan).
#
# A tag like v0.2.0 also packages the engine and publishes it to the
# project's package registry, where `:Den build` downloads it from:
#   - Linux x86_64 and arm64 on GitLab's free shared runners
#   - macOS only when the CI variable DEN_MACOS_RUNNER is "yes": a runner
#     with the tag `macos` (your own Mac with gitlab-runner, free) builds it

image: rust:1-bookworm

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  # Tests run git; keep a runner's config from changing what they do.
  GIT_CONFIG_NOSYSTEM: "1"

cache:
  key: $CI_JOB_NAME
  paths:
    - .cargo-home/registry
    - target

stages: [check, test, package, publish]

fmt:
  stage: check
  script:
    - cargo fmt --all --check

clippy:
  stage: check
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

test:
  stage: test
  script:
    - cargo test --workspace

neovim:
  stage: test
  script:
    - curl -fsSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
    - tar xzf nvim.tar.gz
    - export PATH="$PWD/nvim-linux-x86_64/bin:$PATH"
    - ./scripts/build-nvim.sh
    - ./scripts/test-nvim.sh

.package:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - ./scripts/package.sh
  artifacts:
    paths: [dist/]
    expire_in: 1 week

package-linux-x86_64:
  extends: .package

package-linux-arm64:
  extends: .package
  tags: [saas-linux-small-arm64]

package-macos:
  extends: .package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/ && $DEN_MACOS_RUNNER == "yes"
  tags: [macos]

publish:
  stage: publish
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - package-linux-x86_64
    - package-linux-arm64
    - job: package-macos
      optional: true
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/den/$VERSION"
    - cat dist/*.tar.gz.sha256 | sort -k 2 > dist/SHA256SUMS
    - |
      for f in dist/*.tar.gz dist/SHA256SUMS; do
        curl --fail-with-body -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$BASE/$(basename "$f")"
      done
    - |
      LINKS=""
      for f in dist/*.tar.gz dist/SHA256SUMS; do
        n=$(basename "$f")
        LINKS="$LINKS{\"name\":\"$n\",\"url\":\"$BASE/$n\"},"
      done
      curl --fail-with-body -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" \
        -d "{\"tag_name\":\"$CI_COMMIT_TAG\",\"name\":\"Den $CI_COMMIT_TAG\",\"assets\":{\"links\":[${LINKS%,}]}}" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
