[package]
name = "den-agent"
description = "Holds the unlocked vault key for a session, so it never sits in an editor."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "den-agent"
path = "src/main.rs"

# `cargo binstall den-agent` downloads the program from the GitHub release for
# this version (built by .github/workflows/release.yml), and compiles it
# where there is none. Never from third-party build caches.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/den-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[dependencies]
age = { version = "0.12", features = ["armor", "plugin"] }
den-core.workspace = true
nix = { version = "0.31", features = ["user", "socket", "resource", "mman", "process"] }
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
robius-authentication = "0.3"
security-framework = "3"

[dev-dependencies]
tempfile.workspace = true

# The workspace forbids `unsafe`; this crate only denies it, because keeping
# the key out of swap (mlock) is an `unsafe` system call. It is allowed on
# that one function.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
