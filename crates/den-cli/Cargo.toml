[package]
name = "den-cli"
description = "The `den` command: prompt summary, capture, sync and the passphrase helper."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "den"
path = "src/main.rs"

# `cargo binstall den-cli` downloads the program from the GitHub release for
# this version (built by .github/workflows/release.yml), and compiles it
# where there is none. Never from third-party build caches.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/den-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[dependencies]
clap.workspace = true
den-core.workspace = true
jiff.workspace = true
rmpv.workspace = true
rpassword.workspace = true
zeroize.workspace = true

[dev-dependencies]
jiff.workspace = true
tempfile.workspace = true

[lints]
workspace = true
