[package]
name = "den-gui"
description = "Den's desktop interface."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "den"

[[bin]]
name = "den"
path = "src/main.rs"

[[bin]]
name = "den-icons"
path = "src/bin/den-icons.rs"

[lib]
name = "den"
path = "src/lib.rs"

[dependencies]
den-core.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
# `tokio` is what supplies `iced::time`; the default thread-pool backend ships
# an empty `time` module, so timers (the focus clock, the vault poll) need it.
iced = { version = "0.14.0", features = ["canvas", "svg", "image", "lazy", "tokio"] }
fontdb = "0.23.0"
png = "0.17.16"
rmpv = "1.3.1"
dark-light = "3.0.0"
resvg = { version = "0.45", default-features = false }
