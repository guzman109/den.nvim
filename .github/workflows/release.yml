# A tag like v0.2.0 builds the engine, `den`, `den-agent` and `den-mcp` for
# macOS (Apple silicon) and Linux (x86_64 and arm64), and attaches them to a
# GitHub release with a SHA256SUMS file. Den downloads from there on
# machines without Rust, and so does `cargo binstall`. Then it publishes
# the crates to crates.io, once the repository variable PUBLISH_CRATES is
# "true" (README.md, "Releasing"). All runners are free for public
# repositories.
#
# Only the publish job can write to the repository, and every action is
# pinned to a commit (the tag it was is noted beside it), so a moved tag
# upstream cannot change what runs with that permission.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  package:
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after checkout needs to push.
          persist-credentials: false
      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          grep -q "\"$version\"" lua/den/version.lua || { echo "lua/den/version.lua is not $version"; exit 1; }
          grep -q "^den-core = { path = \"crates/den-core\", version = \"$version\" }" Cargo.toml || { echo "the den-core dependency is not $version"; exit 1; }
      - run: rustup toolchain install
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: den-${{ matrix.os }}
          path: dist/*
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: cat dist/*.tar.gz.sha256 | sort -k 2 > dist/SHA256SUMS
      - run: >
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "Den $GITHUB_REF_NAME"
          --notes "Prebuilt engine for :Den build. Checksums in SHA256SUMS."
        env:
          GH_TOKEN: ${{ github.token }}
  # crates.io's trusted publishing: GitHub vouches for this workflow and
  # crates.io hands back a token that lasts 30 minutes, revoked when the
  # job ends. No API key is stored. It needs the crates published once by
  # hand and this workflow registered on each of them, hence the switch.
  crates:
    needs: publish
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # den-core first, then the three programs; the Neovim module is not
      # published.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
