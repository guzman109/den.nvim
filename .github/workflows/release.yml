# A tag like v0.2.0 packages the engine for macOS and Linux and attaches it
# to a GitHub release, where `:Den build` downloads it from (set the URL in
# lua/den/download.lua). Free for public repositories.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: den-${{ matrix.os }}
          path: dist/*
  publish:
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cat dist/*.tar.gz.sha256 | sort -k 2 > dist/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Den $GITHUB_REF_NAME" --notes "Prebuilt engine for :Den build."
        env:
          GH_TOKEN: ${{ github.token }}
