[workspace]
members = ["crates/den-core", "crates/den-gui", "crates/den-nvim"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
den-core = { path = "crates/den-core" }
jiff = "0.2.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
