[workspace]
members = ["crates/den-core", "crates/den-nvim", "crates/den-cli", "crates/den-agent", "crates/den-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/guzman109/Den"

[workspace.dependencies]
age = { version = "0.12", features = ["armor"] }
den-core = { path = "crates/den-core" }
clap = { version = "4", features = ["derive"] }
gethostname = "1"
resvg = { version = "0.48", default-features = false }
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
rmpv = "1"
rpassword = "7"
gix = { version = "0.87", default-features = false, features = ["sha1", "status", "blame", "revision"] }
jiff = { version = "0.2", features = ["serde"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
thiserror = "2"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
